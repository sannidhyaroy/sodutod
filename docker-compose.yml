name: sodutod

services:
  bot:
    image: ghcr.io/sannidhyaroy/sodutod:latest
    # For a local build instead of the image, uncomment the following build line and comment out the image line above
    # build: .
    env_file: .env
    environment:
      STATE_DIR: /data
    restart: unless-stopped
    volumes:
      - bot-data:/data

volumes:
  bot-data:
